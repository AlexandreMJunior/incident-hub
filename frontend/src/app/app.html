<aside class="sidebar">
  <a class="brand" routerLink="/"><span class="brand-mark">IH</span><span>Incident Hub</span></a>
  <nav aria-label="Navegação principal">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 19a9 9 0 1 1 16 0M12 13l4-5" /></svg
      >Dashboard</a
    >
    <a
      routerLink="/incidents"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      [class.active]="isDetail"
      ariaCurrentWhenActive="page"
      ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="m3 6 2 2 3-4m-5 12 2 2 3-4M12 6h9M12 12h9M12 18h9" /></svg
      >Incidentes</a
    >
    <a routerLink="/incidents/new" routerLinkActive="active" ariaCurrentWhenActive="page"
      ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg
      >Novo incidente</a
    >
  </nav>
  <div class="shift">
    <span class="avatar">OP</span>
    <div>Escala Operações<small>turno 08–16</small></div>
  </div>
</aside>
<div class="workspace">
  <header class="topbar">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="2" />
      <path d="M9 3v18" /></svg
    ><span>Operações</span><span class="separator">/</span
    ><span class="current">{{ breadcrumb }}</span>
  </header>
  <main><router-outlet /></main>
</div>
